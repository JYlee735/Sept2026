<!DOCTYPE HTML>
<html>
<head>
<title>Internal CSS</title>
<link rel=icon href=sunflower.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>

<style>
body {
    background-color: oldlace;
    padding: 25px;
    font-size: 200%;
    margin: 20px;
}

h1 {
    color: cyan;
    padding: 15px;
    background: silver;
    width: fit-content;
    font-family: cursive;
    font-size: 300%;
    text-shadow: 2px 2px 4px gray;
    border: 3px solid black;
    border-radius: 15px;
}

p {
    color: darkblue;
    letter-spacing: 2px;
}

p.second {
    background-color: lightyellow;
    text-align: center;
    word-spacing: 5px;
    padding: 10px;
    margin: 20px;
}

p.third {
    line-height: 150%;
    border-style: double;
    border-width: 5px;
    border-color: blue;
    padding: 15px;
    text-align: justify;
    max-width: 1000px;
}
</style>

</head>

<body>

<h1>CSS</h1>

<p>
<b>CSS (Cascading Style Sheet)</b> was developed by
<b>W3C (World Wide Web Consortium)</b> in 1996.
</p>

<p class="second">
It allows you to create great-looking web pages.
</p>

<p class="third">
CSS is used along with HTML and JavaScript in most websites
to create user interfaces for web applications and user interfaces
for many mobile applications.
</p>

</body>
</html>
