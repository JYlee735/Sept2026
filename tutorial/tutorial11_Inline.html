<p style="color:darkblue; letter-spacing:2px;">
<b style="font-weight:bold;">CSS (Cascading Style Sheet)</b> was developed by
<b style="font-weight:bold;">W3C (World Wide Web Consortium)</b> in 1996.
</p>

<p style="color:darkblue; letter-spacing:2px; background-color:lightyellow; text-align:center; word-spacing:5px; padding:10px; margin:20px;">
It allows you to create great-looking web pages.
</p>

<p style="color:darkblue; letter-spacing:2px; line-height:150%; border-style:double; border-width:5px; border-color:blue; padding:15px; text-align:justify; max-width:1000px;">
CSS is used along with HTML and JavaScript in most websites
to create user interfaces for web applications and user interfaces
for many mobile applications.
</p>
